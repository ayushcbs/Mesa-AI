# Netlify Configuration for Mesa Workspace Intelligence

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Specific endpoint redirects to dedicated serverless functions
[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/feedback"
  status = 200

[[redirects]]
  from = "/api/gemini/generate"
  to = "/.netlify/functions/gemini-generate"
  status = 200

# Unified catch-all for any other /api/* routes via serverless-http Express wrapper
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Protect server bundle and sourcemaps from static public CDN delivery
[[redirects]]
  from = "/server.cjs*"
  to = "/index.html"
  status = 404
  force = true

# Single Page Application (SPA) fallback to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
